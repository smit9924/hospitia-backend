name: Bug report
description: Something in Hospitia doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please don't include passwords, tokens or `.env` contents.
        Security vulnerabilities must be reported privately; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as an owner
        2. Open Rooms
        3. ...
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - Admin
        - Owner
        - Manager
        - Customer
        - Not signed in
        - Not applicable
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local dev container, cloud session or production; browser and version; commit if known.
  - type: textarea
    id: evidence
    attributes:
      label: Error details
      description: The `errorCode` and `X-Request-ID` of the failing response, log lines or screenshots.
